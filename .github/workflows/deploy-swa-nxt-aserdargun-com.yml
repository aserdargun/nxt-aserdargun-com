name: Deploy swa-nxt-aserdargun-com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-nxt-aserdargun-com-production
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      NXT_VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate portable source and artifacts
        run: pnpm validate:ci

  deploy:
    runs-on: ubuntu-latest
    env:
      NXT_VITEST_MAX_WORKERS: "1"
    if: github.ref == 'refs/heads/main'
    needs:
      - portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Repeat portable artifact validation
        run: pnpm validate:ci
      - name: Deploy prebuilt artifacts
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_NXT_ASERDARGUN_COM }}
          action: upload
          app_location: web/dist
          api_location: api-dist
          output_location: ""
          skip_app_build: true
